
<div class="min-h-screen bg-slate-100 px-4 py-5">

  <main class="mx-auto max-w-screen-2xl">

    <!-- ENCABEZADO -->
    <header class="mb-5 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold text-slate-900">
          Pizzería
        </h1>
        <p class="text-sm text-slate-500">
          Sistema de pedidos y ventas
        </p>
      </div>

      <span class="rounded-full bg-green-100 px-3 py-1 text-xs font-semibold text-green-700">
        Punto de venta
      </span>
    </header>

    <!-- FORMULARIO -->
    <form [formGroup]="formulario">

      <div class="grid grid-cols-1 gap-5 lg:grid-cols-12">

        <!-- DATOS DEL CLIENTE -->
        <section
          class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm lg:col-span-7">

          <h2 class="mb-4 text-lg font-bold text-slate-900">
            Datos del cliente
          </h2>

          <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">

            <div>
              <label for="nombre"
                class="mb-1 block text-sm font-medium text-slate-700">
                Nombre completo
              </label>

              <input
                id="nombre"
                type="text"
                formControlName="nombre"
                placeholder="Nombre del cliente"
                class="w-full rounded-lg border border-slate-300 p-2.5 text-sm">
            </div>

            <div>
              <label for="direccion"
                class="mb-1 block text-sm font-medium text-slate-700">
                Dirección
              </label>

              <input
                id="direccion"
                type="text"
                formControlName="direccion"
                placeholder="Dirección del cliente"
                class="w-full rounded-lg border border-slate-300 p-2.5 text-sm">
            </div>

            <div>
              <label for="telefono"
                class="mb-1 block text-sm font-medium text-slate-700">
                Teléfono
              </label>

              <input
                id="telefono"
                type="tel"
                formControlName="telefono"
                placeholder="4771234567"
                class="w-full rounded-lg border border-slate-300 p-2.5 text-sm">
            </div>

            <div>
              <label for="fecha"
                class="mb-1 block text-sm font-medium text-slate-700">
                Fecha de compra
              </label>

              <input
                id="fecha"
                type="date"
                formControlName="fecha"
                class="w-full rounded-lg border border-slate-300 p-2.5 text-sm">
            </div>

          </div>

        </section>

        <!-- CONFIGURACIÓN DE PIZZA -->
        <section
          class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm lg:col-span-5">

          <h2 class="mb-4 text-lg font-bold text-slate-900">
            Armar pizza
          </h2>

          <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">

            <!-- TAMAÑO -->
            <div>
              <p class="mb-2 text-sm font-semibold text-slate-700">
                Tamaño
              </p>

              <div class="space-y-2 text-sm">

                <label class="flex items-center gap-2">
                  <input type="radio"
                    formControlName="tamano"
                    value="Chica">
                  Chica - $40
                </label>

                <label class="flex items-center gap-2">
                  <input type="radio"
                    formControlName="tamano"
                    value="Mediana">
                  Mediana - $80
                </label>

                <label class="flex items-center gap-2">
                  <input type="radio"
                    formControlName="tamano"
                    value="Grande">
                  Grande - $120
                </label>

              </div>
            </div>

            <!-- INGREDIENTES -->
            <div>
              <p class="mb-2 text-sm font-semibold text-slate-700">
                Ingredientes (+$10)
              </p>

              <div class="space-y-2 text-sm">

                <label class="flex items-center gap-2">
                  <input type="checkbox"
                    formControlName="jamon">
                  Jamón
                </label>

                <label class="flex items-center gap-2">
                  <input type="checkbox"
                    formControlName="pina">
                  Piña
                </label>

                <label class="flex items-center gap-2">
                  <input type="checkbox"
                    formControlName="champinones">
                  Champiñones
                </label>

              </div>
            </div>

          </div>

          <!-- CANTIDAD Y AGREGAR -->
          <div class="mt-5 flex items-end gap-3">

            <div class="w-28 shrink-0">
              <label for="cantidad"
                class="mb-1 block text-sm font-medium text-slate-700">
                Cantidad
              </label>

              <input
                id="cantidad"
                type="number"
                min="1"
                formControlName="cantidad"
                class="w-full rounded-lg border border-slate-300 p-2.5 text-sm">
            </div>

            <button
              type="button"
              (click)="agregarPizza()"
              class="flex-1 rounded-lg bg-blue-700 px-4 py-2.5 text-sm font-semibold text-white hover:bg-blue-800">
              + Agregar pizza
            </button>

          </div>

        </section>

      </div>

    </form>

    <!-- DETALLE Y VENTAS -->
    <div class="mt-5 grid grid-cols-1 items-start gap-5 xl:grid-cols-2">

      <app-detalle
        [pizzas]="pizzas"
        (quitar)="quitarPizza($event)"
        (terminar)="terminarPedido()">
      </app-detalle>

      <app-ventas></app-ventas>

    </div>

  </main>

</div>
